# Scoring rubric — NEUTRAL EXAMPLE.
#
# This is the one file that is genuinely yours. The engine is generic; the rubric
# is your strategy expressed as numbers, and it is why the real one does not ship
# with this repo.
#
# Two axes, deliberately separate. Collapsing them into a single "good fit" score
# is the mistake this design exists to avoid: a company can be extremely useful
# and completely safe to depend on, or extremely useful and a direct future
# competitor. One number cannot say both.

axes:
  # S — how much capability this company would add if you worked with them.
  strategic_value:
    weight: 1.0
    signals:
      solves_a_named_bottleneck:  30   # a problem already on your roadmap
      production_deployments:     20   # shipped, not a demo
      self_serve_or_trial:        15   # you can evaluate without a sales cycle
      published_pricing:          10   # you can model cost today
      adjacent_customers:         10   # already serves people like you

  # I — how replaceable they become once you have what they provide.
  internalizability:
    weight: 1.0
    signals:
      commodity_underneath:       25   # thin layer over something open
      no_proprietary_data:        20   # nothing you cannot rebuild
      small_team:                 15   # capability, not an institution
      open_source_equivalent:     15   # a credible alternative exists
      # A LOW score here is not bad. It means a real moat, which makes them a
      # better long-term partner and a worse acquisition target. Read it, do not
      # optimize it.

# Explicit competitor detection. Without this, the highest-scoring companies are
# reliably the ones building exactly what you build — they look like a perfect
# partner on every capability signal.
competitor:
  same_buyer_and_problem:        -100
  same_buyer_adjacent_problem:    -30

leverage:
  cost_of_trying:                 25   # self-serve install beats a founder call
  reversibility:                  15   # how cheaply you can back out

# Tiers are assigned from (S, I), never from a single blended number.
tiers:
  T1: {min_strategic: 70, note: "act now — high value, act before it changes"}
  T2: {min_strategic: 55, note: "worth a conversation this quarter"}
  T3: {min_strategic: 40, note: "watch"}
  T5: {min_strategic: 0,  note: "logged, no action"}
  T6: {note: "stage-1 false positive — recorded so it is not re-surfaced"}

# Below this length, a description carries no signal and the company must be
# resolved by reading its actual site. Cheap prefilters cannot judge a stub.
thin_description:
  min_chars: 120
